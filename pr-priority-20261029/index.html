$('rows').innerHTML=rows.map(r=>`<tr><td><strong>${r.rank}</strong><br><span class="pill ${r.tier}">${r.tier}</span></td><td><strong>${esc(r.repo)} #${r.n}</strong><br>${esc(r.title)}<br><a class="url" href="${r.url}" target="_blank" rel="noopener">${r.url}</a><div class="small">${esc(r.head.slice(0,12))} → ${esc(r.base)}${r.draft?' · DRAFT':''}</div></td><td>${esc(cats[r.cat][lang==='zh'?0:1])}${r.groups.map(i=>`<br><a href="#g${i}">${T('核对组','Group')} ${i+1}</a>`).join('')}</td><td>${esc(({MERGEABLE:T('无冲突','No conflicts'),CONFLICTING:T('有冲突','Conflicts'),UNKNOWN:T('可合并性待计算','Mergeability pending')})[r.merge]||r.merge)}<br>${r.review==='APPROVED'?T('页面显示已批准','Page shows approved'):T('未获当前范围批准','No current-scope approval')}<br><span class="${r.bad.length?'red':''}">${r.bad.length} ${T('失败','failed')} · ${r.pending} ${T('待完成','pending')} / ${r.checks} ${T('已上报','reported')}</span><details><summary>${T('检查与范围','Checks & scope')}</summary><div class="small">${r.files} ${T('修改文件；本轮未重跑测试','changed files; no tests rerun')}<br>${r.bad.map(esc).join('<br>')||T('未见已上报失败，不等于全套验收通过','No reported failure; not full acceptance')}</div></details></td><td>${esc(r.action[lang==='zh'?0:1])}</td></tr>`).join('')||`<tr><td colspan="5" class="empty">${T('没有匹配项','No matches')}</td></tr>`;
$('gtitle').textContent=T('重合证据与保留建议','Overlap evidence and retention guidance');$('method').textContent=T('前7组为重合/回移候选，后3组解释为什么不能按相似标题判重复。新增行匹配只用于筛选；结合目标分支、文件blob及实际触发条件判断。没有对上游所有已合入PR做穷尽等价审计。','The first seven groups contain overlap/backport candidates; the last three explain non-duplicate relationships. Added-line matching is a screening heuristic, checked against target branches, file blobs and predicates. This is not an exhaustive equivalence audit of all upstream merged PRs.');$('groups').innerHTML=D.groups.map((g,i)=>`<article id="g${i}" class="card"><span class="pill">${i+1} · ${esc(cats[g.kind][lang==='zh'?0:1])}</span><h3>${g.ids.map(n=>'#'+n).join(' · ')}</h3><p>${esc(g.text[lang==='zh'?0:1])}</p>${g.ids.map(n=>{let r=D.rows.find(r=>r.n===n);return r?`<a class="url" href="${r.url}" target="_blank" rel="noopener">${r.url}</a><br>`:''}).join('')}</article>`).join('');$('footer').textContent=T('数据口径：Liuchenbing-2026作者、当前可见OPEN PR，共58项；目标仓9个。包括个人项目组织仓，但本批没有个人fork目标。原始PR标题、SHA和URL保留原文。批准可能来自较早head；CI失败未读日志的不推断根因。每项是否已被main覆盖仍需行为证据，不能从相似代码推出可直接关闭。页面不是自动刷新服务。','Scope: 58 visible OPEN PRs authored by Liuchenbing-2026 across nine target repositories. Original titles, SHAs and URLs are preserved. Approvals may predate the latest head. CI failures are not attributed without logs. Upstream coverage requires behavioral evidence; similar code alone does not authorize closure. This is a static snapshot.');}
['search','repo','tier','category','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));['zh','en'].forEach(l=>$(l).onclick=()=>{lang=l;try{localStorage.setItem('prdesk-lang',l);const u=new URL(location.href);u.searchParams.set('lang',l);history.replaceState(null,'',u)}catch{}render()});$('reset').onclick=()=>{$('search').value='';['repo','tier','category'].forEach(i=>$(i).value='');$('sort').value='rank';render()};render();
</script></html>
