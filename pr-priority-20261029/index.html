const q=$('search').value.toLowerCase();let rows=D.rows.filter(r=>(!$('repo').value||r.repo===$('repo').value)&&(!$('tier').value||r.tier===$('tier').value)&&(!$('category').value||r.cat===$('category').value)&&`${r.n} ${r.repo} ${r.title} ${r.action.join(' ')}`.toLowerCase().includes(q));rows.sort((a,b)=>$('sort').value==='repo'?a.repo.localeCompare(b.repo)||a.rank-b.rank:$('sort').value==='fail'?b.bad.length-a.bad.length||a.rank-b.rank:a.rank-b.rank);$('count').textContent=T(`显示 ${rows.length} / 52 项 · P0优先推进；P1补评审/CI；P2验证/冲突；P3必要性/范围/草稿`,`Showing ${rows.length} / 52 · P0 priority follow-up; P1 review/CI; P2 validation/conflicts; P3 necessity/scope/drafts`);
$('rows').innerHTML=rows.map(r=>`<tr><td><strong>${r.rank}</strong><br><span class="pill ${r.tier}">${r.tier}</span></td><td><strong>${esc(r.repo)} #${r.n}</strong><br>${esc(r.title)}<br><a class="url" href="${r.url}" target="_blank" rel="noopener">${r.url}</a><div class="small">${esc(r.head.slice(0,12))} → ${esc(r.base)}${r.draft?' · DRAFT':''}</div></td><td>${esc(cats[r.cat][lang==='zh'?0:1])}${r.groups.map(i=>`<br><a href="#g${i}">${T('核对组','Group')} ${i+1}</a>`).join('')}</td><td>${esc(({MERGEABLE:T('无冲突','No conflicts'),CONFLICTING:T('有冲突','Conflicts'),UNKNOWN:T('可合并性待计算','Mergeability pending')})[r.merge]||r.merge)}<br>${r.review==='APPROVED'?T('页面显示已批准','Page shows approved'):T('未获当前范围批准','No current-scope approval')}<br><span class="${r.bad.length?'red':''}">${r.bad.length} ${T('失败','failed')} · ${r.pending} ${T('待完成','pending')} / ${r.checks} ${T('已上报','reported')}</span><details><summary>${T('检查与范围','Checks & scope')}</summary><div class="small">${T('本轮未重跑测试；检查含成功、跳过与失败。','No tests rerun; reported checks include success, skipped and failed.')}<br>${esc(r.mergeState)}<br>${r.bad.map(esc).join('<br>')||T('未见已上报失败，不等于全套验收通过','No reported failure; not full acceptance')}</div></details></td><td>${esc(r.action[lang==='zh'?0:1])}<br><span class="small">${T('最近更新：','Updated: ')}${esc(r.updated)}${r.changed?T(' · 代码已更新',' · New head'):''}</span><details><summary>${T('评审与历史待办','Reviews & historical notes')}</summary>${r.reviews.map(v=>esc(v.who+' · '+v.state+' · '+v.time+' · '+(v.current?T('当前head','Current head'):T('旧head','Earlier head')))).join('<br>')}<p>${T('上次快照待办（可能已过时）：','Previous snapshot note (may be outdated): ')}${esc(r.history[lang==='zh'?0:1])}</p></details></td></tr>`).join('')||`<tr><td colspan="5" class="empty">${T('没有匹配项','No matches')}</td></tr>`;
$('updates').innerHTML='<h2>'+T('本次变化与近期合入','Changes and recent merges')+'</h2><p>'+T('当前52个OPEN、含3个草稿。#44102于10月30日09:53获当前head人工批准，排序升至第3；#17344当前21成功、0失败、5跳过。已关闭PR已移出当前队列。以下为近期合入记录。','52 open PRs, including 3 drafts. #44102 received current-head human approval on Oct 30 at 09:53 Beijing time and moves to rank 3. #17344 has 21 successes, 0 failures and 5 skips. Closed PRs are removed from this queue. Recent merges follow.')+'</p>'+D.recentMerged.map(x=>'<p><a href="'+x.html_url+'">'+x.html_url+'</a><br>'+esc(x.title)+' · '+esc(x.merged_at)+'</p>').join('');$('gtitle').textContent=T('10月29日重合证据（历史快照）','Oct 29 overlap evidence (historical snapshot)');$('method').textContent=T('前7组为重合/回移候选，后3组解释为什么不能按相似标题判重复。新增行匹配只用于筛选；结合目标分支、文件blob及实际触发条件判断。没有对上游所有已合入PR做穷尽等价审计。','The first seven groups contain overlap/backport candidates; the last three explain non-duplicate relationships. Added-line matching is a screening heuristic, checked against target branches, file blobs and predicates. This is not an exhaustive equivalence audit of all upstream merged PRs.');$('groups').innerHTML=D.groups.map((g,i)=>`<article id="g${i}" class="card"><span class="pill">${i+1} · ${esc(cats[g.kind][lang==='zh'?0:1])}</span><h3>${g.ids.map(n=>'#'+n).join(' · ')}</h3><p>${esc(g.text[lang==='zh'?0:1])}</p>${g.ids.map(n=>{let r=D.rows.find(r=>r.n===n);return r?`<a class="url" href="${r.url}" target="_blank" rel="noopener">${r.url}</a><br>`:''}).join('')}</article>`).join('');$('footer').textContent=T('数据口径：Liuchenbing-2026作者、当前可见OPEN PR，共52项；目标仓9个。包括个人项目组织仓，但本批没有个人fork目标。原始PR标题、SHA和URL保留原文。批准可能来自较早head；CI失败未读日志的不推断根因。每项是否已被main覆盖仍需行为证据，不能从相似代码推出可直接关闭。页面不是自动刷新服务。','Scope: 52 visible OPEN PRs authored by Liuchenbing-2026 across nine target repositories. Original titles, SHAs and URLs are preserved. Approvals may predate the latest head. CI failures are not attributed without logs. Upstream coverage requires behavioral evidence; similar code alone does not authorize closure. This is a static snapshot.');}
['search','repo','tier','category','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));['zh','en'].forEach(l=>$(l).onclick=()=>{lang=l;try{localStorage.setItem('prdesk-lang',l);const u=new URL(location.href);u.searchParams.set('lang',l);history.replaceState(null,'',u)}catch{}render()});$('reset').onclick=()=>{$('search').value='';['repo','tier','category'].forEach(i=>$(i).value='');$('sort').value='rank';render()};render();
</script></html>
